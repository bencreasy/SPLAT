# LoRa configuration
lora:
  enabled: true
  device: "/dev/spidev0.0"
  frequency: 915.0
  bandwidth: 125000
  spreading_factor: 7
  coding_rate: 5
  tx_power: 20
  sync_word: 0x12

# Storage configuration
storage:
  enabled: true
  max_buffer_size: "100M"
  max_storage: "10G"
  backup_enabled: true
  backup_interval: 86400
  cleanup_age: 30  # days

# Display configuration
display:
  enabled: true
  type: "ssd1306"
  width: 128
  height: 64
  i2c_address: "0x3C"
  rotation: 0
  contrast: 255
  update_interval: 1

# Cloud configuration
cloud:
  enabled: true
  project_id: "${GCP_PROJECT_ID}"
  region: "${GCP_REGION}"
  retry_attempts: 3
  retry_delay: 30
  batch_size: 100
  sync_interval: 60

# Monitor configuration
monitor:
  enabled: true
  check_interval: 60
  metrics_interval: 300
  alert_retention: 604800  # 7 days
  thresholds:
    cpu_warning: 80
    cpu_critical: 90
    memory_warning: 80
    memory_critical: 90
    disk_warning: 80
    disk_critical: 90
    temp_warning: 70
    temp_critical: 80
